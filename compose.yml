services:
  mysql:
    image: mysql:8.4
    container_name: multi-tenant-mysql
    environment:
      MYSQL_DATABASE: tenant_db
      MYSQL_USER: tenant_user
      MYSQL_PASSWORD: tenant_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
