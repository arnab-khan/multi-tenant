spring.application.name=tenant-service
server.port=8081
spring.graphql.graphiql.enabled=true


# Connect to the tenant_db database in MySQL.
# Port 3307 is the port exposed on your computer by Docker.
spring.datasource.url=jdbc:mysql://localhost:3307/tenant_db

# MySQL account used by this service.
spring.datasource.username=tenant_user
spring.datasource.password=tenant_password

# Update database tables to match JPA entities when the app starts.
spring.jpa.hibernate.ddl-auto=update

# Print SQL statements in the application console.
spring.jpa.show-sql=true