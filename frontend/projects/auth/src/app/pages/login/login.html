<h1>Log in</h1>

<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <p>
    <label for="login-username">Username</label><br />
    <input id="login-username" formControlName="username" type="text" autocomplete="username" />
  </p>
  <p>
    <label for="login-password">Password</label><br />
    <input id="login-password" formControlName="password" type="password" autocomplete="current-password" />
  </p>
  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Logging in...' : 'Log in' }}
  </button>
  <p aria-live="polite">{{ loginMessage() }}</p>
</form>
