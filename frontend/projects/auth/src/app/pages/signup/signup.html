<h1>Sign up</h1>

<form [formGroup]="signupForm" (ngSubmit)="onSignup()">
  <p>
    <label for="name">Name</label><br />
    <input id="name" formControlName="name" type="text" autocomplete="name" />
  </p>

  <p>
    <label for="username">Username</label><br />
    <input id="username" formControlName="username" type="text" autocomplete="username" />
    <span aria-live="polite">{{ usernameMessage() }}</span>
  </p>

  <p>
    <label for="password">Password</label><br />
    <input id="password" formControlName="password" type="password" autocomplete="new-password" />
  </p>

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Creating account...' : 'Sign up' }}
  </button>
  <p aria-live="polite">{{ signupMessage() }}</p>
</form>
